name: Robot de noticias del arroz

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "img/og.jpg"
      - "img/og-fecha.txt"

permissions:
  contents: write

concurrency:
  group: robot-arroz
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar sharp (para la foto de vista previa)
        run: npm install --no-save --no-package-lock sharp
      - name: Correr el robot
        run: node robot/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-arroz"
          git config user.email "robot-arroz@users.noreply.github.com"
          git add data/noticias.json img/og.jpg img/og-fecha.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Robot: noticias del arroz $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia"
          git pull --rebase origin main || true
          git push
